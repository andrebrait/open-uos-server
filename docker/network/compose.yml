services:
  unifi-network-application:
    build:
      context: ../..
      dockerfile: docker/network/Dockerfile
    container_name: open-uos-network
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - MONGO_USER=unifi
      - MONGO_PASS=unifi
      - MONGO_HOST=unifi-db
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifi
    ports:
      - "8443:8443"
      - "8080:8080"
      - "3478:3478/udp"
      - "10001:10001/udp"
    volumes:
      - unifi_network_config:/config
    depends_on:
      - unifi-db

  unifi-db:
    image: docker.io/mongo:7.0
    container_name: open-uos-network-db
    restart: unless-stopped
    volumes:
      - unifi_network_db:/data/db

volumes:
  unifi_network_config:
  unifi_network_db:
